name: Run Tests

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - develop/**
    # Lets deploy.yaml run these jobs as a gate before deploying (push to main).
    workflow_call:

jobs:
    tests-java:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                distribution: temurin
                java-version: '25'
                cache: maven
            # No secrets or database needed: Spring context tests run on the "test" profile
            # (backend/src/test/resources/application-test.yaml).
            - name: Run backend tests
              run: |
                java --version
                ./mvnw --batch-mode test

    tests-npm:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                # Same major version as the frontend Dockerfile (NODE_VERSION).
                node-version: '24'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Run frontend tests
              run: npm test
            - name: Build frontend
              run: npm run build
