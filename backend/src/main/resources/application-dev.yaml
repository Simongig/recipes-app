spring:
  servlet:
    multipart:
      max-file-size: "10MB"
      # Whole-request cap (several images per recipe). Must stay <= client_max_body_size
      # in frontend/nginx.conf, otherwise nginx rejects the upload first.
      max-request-size: "25MB"
  data:
    mongodb:
      uri: mongodb://localhost:27017/kochbuch_dev?directConnection=true
      database: kochbuch_dev
jwt:
  secret: dev-only-not-a-real-secret

ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  api-key: ${ML_SERVICE_API_KEY}

app:
  admin:
    username: admin
    password: password