spring:
  servlet:
    multipart:
      max-file-size: "10MB"
      # Whole-request cap (several images per recipe). Must stay <= client_max_body_size
      # in frontend/nginx.conf, otherwise nginx rejects the upload first.
      max-request-size: "25MB"
  # data:
  #   mongodb:
      # uri: // in docker compose.yaml
      # database: // in docker compose.yaml
jwt:                                                                                                                                                                                                                                                        
  secret: ${JWT_SECRET}

app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  api-key: ${ML_SERVICE_API_KEY}

frontend:
  # SPA shell (index.html) is fetched from here for social-preview meta-tag injection.
  # In prod this is the internal nginx service; locally it's the Vite dev server.
  internal-url: ${FRONTEND_INTERNAL_URL:http://localhost:8081}

server:
  # ssl:
  #   key-store: classpath:keystore.jks
  #   key-store-password: Z*EhJDbgz6
  #   key-store-type: JKS
  #   key-alias: kochbuch.io
  #   enabled: true
  port: 8080

cloudflare:
  r2:
    # Format: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
    endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
    access-key: ${R2_ACCESS_KEY_ID}
    secret-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET_NAME}
    # Public base URL the browser loads images from (r2.dev subdomain or custom domain of the bucket).
    # The S3 endpoint above is NOT publicly readable, so this is what gets stored in Recipe.imagePaths.
    public-url: ${R2_PUBLIC_URL}