worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Known social-media / link-preview crawlers: their requests to /recipe/id/* are proxied to
    # the backend, which injects per-recipe Open Graph meta tags into the SPA shell. Everyone else
    # gets the static SPA shell directly (no extra hop, no backend load).
    map $http_user_agent $is_social_crawler {
        default 0;
        ~*facebookexternalhit 1;
        ~*Facebot 1;
        ~*Twitterbot 1;
        ~*WhatsApp 1;
        ~*Slackbot 1;
        ~*LinkedInBot 1;
        ~*TelegramBot 1;
        ~*Discordbot 1;
        ~*Pinterest 1;
        ~*redditbot 1;
        ~*Googlebot 1;
        ~*bingbot 1;
    }
    charset       utf-8;

    # Upload limit for the recipe form (multipart with images). Set here in http{} so both
    # server blocks inherit it — a per-server directive would leave the other one on nginx's
    # 1M default. Keep in sync with spring.servlet.multipart.max-request-size in
    # backend/src/main/resources/application.yaml.
    client_max_body_size 25M;

    access_log    off;
    error_log     /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # HTTP — only used for certbot challenge + redirect to HTTPS
    server {
        listen 8080;
        server_name kochbuch.io www.kochbuch.io;

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Plain-HTTP, no-redirect access to the SPA shell for the backend's internal fetch
        # (SpaShellClient / FRONTEND_INTERNAL_URL). index.html is public anyway.
        location = /index.html {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name kochbuch.io www.kochbuch.io;

        root   /usr/share/nginx/html;
        index  index.html;

        ssl_certificate /etc/letsencrypt/live/kochbuch.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kochbuch.io/privkey.pem;

        location /recipe/id/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            if ($is_social_crawler) {
                proxy_pass http://backend:8080;
                break;
            }
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # 'backend' ist der Name deines Services in docker-compose.yml
            proxy_pass http://backend:8080; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        location ~ /.well-known/acme-challenge/ {
              root /var/www/certbot;

        }

        error_page 404 /index.html;
    }
}